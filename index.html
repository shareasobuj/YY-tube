<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free YouTube Music Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .player-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 420px;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .app-title {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 600;
            color: #38bdf8;
            margin-bottom: 20px;
        }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
        }

        .search-box input:focus {
            border-color: #38bdf8;
        }

        .search-box button {
            padding: 12px 18px;
            background: #38bdf8;
            border: none;
            border-radius: 12px;
            color: #0f172a;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .search-box button:hover {
            background: #7dd3fc;
        }

        /* Hidden YouTube IFrame Container */
        .player-container {
            display: none;
        }

        .album-art {
            width: 100%;
            height: 220px;
            border-radius: 16px;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            background-color: #0f172a;
        }

        .song-details {
            text-align: center;
            margin-bottom: 20px;
        }

        .song-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .btn {
            background: none;
            border: none;
            color: #f8fafc;
            font-size: 1.4rem;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .btn:active {
            transform: scale(0.9);
        }

        .btn-play {
            width: 56px;
            height: 56px;
            background: #38bdf8;
            color: #0f172a;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0f172a;
            padding: 10px 16px;
            border-radius: 12px;
        }

        .volume-container input {
            flex: 1;
            accent-color: #38bdf8;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="app-title">🎵 Free YouTube Music</div>

        <div class="search-box">
            <input type="text" id="videoInput" placeholder="YouTube Video ID (e.g. dQw4w9WgXcQ)">
            <button onclick="loadCustomVideo()">Play</button>
        </div>

        <img id="albumArt" src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500&q=80" class="album-art" alt="Album Cover">

        <div class="song-details">
            <div id="songTitle" class="song-title">Select or Load a Song</div>
            <div id="songArtist" class="song-artist">YouTube Audio Stream</div>
        </div>

        <!-- Hidden YouTube API Frame -->
        <div class="player-container">
            <div id="yt-player"></div>
        </div>

        <div class="controls">
            <button class="btn" onclick="prevSong()">⏮</button>
            <button class="btn btn-play" id="playBtn" onclick="togglePlay()">▶</button>
            <button class="btn" onclick="nextSong()">⏭</button>
        </div>

        <div class="volume-container">
            <span>🔊</span>
            <input type="range" id="volumeSlider" min="0" max="100" value="100" oninput="setVolume(this.value)">
        </div>
    </div>

    <!-- YouTube IFrame Player API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        let isPlaying = false;
        let currentTrackIndex = 0;

        // Default Playlist (YouTube Video IDs)
        const playlist = [
            { id: "kJQP7kiw5Fk", title: "Despacito - Luis Fonsi", art: "https://img.youtube.com/vi/kJQP7kiw5Fk/hqdefault.jpg" },
            { id: "JGwWNGJdvx8", title: "Shape of You - Ed Sheeran", art: "https://img.youtube.com/vi/JGwWNGJdvx8/hqdefault.jpg" },
            { id: "3tmd-ClpJxA", title: "Apt. - ROSÉ & Bruno Mars", art: "https://img.youtube.com/vi/3tmd-ClpJxA/hqdefault.jpg" }
        ];

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '0',
                width: '0',
                videoId: playlist[0].id,
                playerVars: {
                    'autoplay': 0,
                    'controls': 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            updateTrackInfo(playlist[currentTrackIndex].title, playlist[currentTrackIndex].art);
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                document.getElementById('playBtn').innerText = '⏸';
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                isPlaying = false;
                document.getElementById('playBtn').innerText = '▶';
            }
            
            if (event.data === YT.PlayerState.ENDED) {
                nextSong();
            }
        }

        function togglePlay() {
            if (!player) return;
            if (isPlaying) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        }

        function loadTrack(index) {
            currentTrackIndex = index;
            const track = playlist[currentTrackIndex];
            player.loadVideoById(track.id);
            updateTrackInfo(track.title, track.art);
        }

        function updateTrackInfo(title, artUrl) {
            document.getElementById('songTitle').innerText = title;
            document.getElementById('albumArt').src = artUrl;
        }

        function nextSong() {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
        }

        function prevSong() {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
        }

        function setVolume(value) {
            if (player) {
                player.setVolume(value);
            }
        }

        function loadCustomVideo() {
            const inputVal = document.getElementById('videoInput').value.trim();
            if (inputVal) {
                // Extracts Video ID if URL is pasted, otherwise uses raw ID
                let videoId = inputVal;
                if (inputVal.includes('v=')) {
                    videoId = inputVal.split('v=')[1].split('&')[0];
                } else if (inputVal.includes('youtu.be/')) {
                    videoId = inputVal.split('youtu.be/')[1].split('?')[0];
                }

                const thumbUrl = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
                player.loadVideoById(videoId);
                updateTrackInfo("Custom Loaded Song", thumbUrl);
                document.getElementById('videoInput').value = '';
            }
        }
    </script>
</body>
              </html>
